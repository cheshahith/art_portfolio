      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#d4a24c" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#12233c" stop-opacity="0.95"/>
