      <stop offset="0%" stop-color="#d4a24c" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#1b4b7a" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0f2744" stop-opacity="0.95"/>
