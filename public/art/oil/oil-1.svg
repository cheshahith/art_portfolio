    <path d="M 180 240 Q 540 120 720 480 T 450 1080" fill="none" stroke="#f0c987" stroke-width="22.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="585" cy="420" r="108" fill="#f0c987" opacity="0.35" />
    <circle cx="315" cy="780" r="162" fill="#1b4b7a" opacity="0.5" />
