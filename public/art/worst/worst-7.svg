<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="800" height="1150">
  <!-- Outer Dark/Wood Background -->
  <rect width="100%" height="100%" fill="#1f2420"/>

  <!-- Paper Card (Slightly Angled Look) -->
  <g transform="translate(48, 69)">
    <rect width="704" height="1012" rx="8" fill="#f5efe3" stroke="#d6ccb8" stroke-width="2"/>
    
    <!-- Grid pattern on paper -->
    <defs>
      <pattern id="grid_worst-7" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="704" height="1012" rx="8" fill="url(#grid_worst-7)"/>

    <!-- Doodle Content -->
    
      <circle cx="400" cy="517.5" r="208" fill="#fce38a" stroke="#333" stroke-width="4"/>
      <circle cx="320" cy="460" r="12" fill="#333"/>
      <circle cx="480" cy="483" r="18" fill="#333"/>
      <path d="M 280 667 Q 400 828 520 598" fill="none" stroke="#e84a5f" stroke-width="6" stroke-linecap="round"/>
      <text x="400" y="977.5" font-family="cursive" font-size="28" fill="#ff5722" text-anchor="middle">Masterpiece in progress</text>
    

    <!-- Washi Tape Accent on Top-Right -->
    <rect x="520" y="-12" width="176" height="32" rx="2" fill="rgba(212,162,76,0.65)" transform="rotate(12 520 0)"/>
    <!-- Washi Tape Accent on Bottom-Left -->
    <rect x="-10" y="862.5" width="160" height="28" rx="2" fill="rgba(230,126,34,0.55)" transform="rotate(-8 0 862.5)"/>
  </g>
</svg>