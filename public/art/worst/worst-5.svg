<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Outer Dark/Wood Background -->
  <rect width="100%" height="100%" fill="#1c262e"/>

  <!-- Paper Card (Slightly Angled Look) -->
  <g transform="translate(60, 60)">
    <rect width="880" height="880" rx="8" fill="#f6f0e4" stroke="#d6ccb8" stroke-width="2"/>
    
    <!-- Grid pattern on paper -->
    <defs>
      <pattern id="grid_worst-5" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="880" height="880" rx="8" fill="url(#grid_worst-5)"/>

    <!-- Doodle Content -->
    
      <circle cx="500" cy="450" r="260" fill="#fce38a" stroke="#333" stroke-width="4"/>
      <circle cx="400" cy="400" r="12" fill="#333"/>
      <circle cx="600" cy="420" r="18" fill="#333"/>
      <path d="M 350 580 Q 500 720 650 520" fill="none" stroke="#e84a5f" stroke-width="6" stroke-linecap="round"/>
      <text x="500" y="850" font-family="cursive" font-size="28" fill="#ff5722" text-anchor="middle">Masterpiece in progress</text>
    

    <!-- Washi Tape Accent on Top-Right -->
    <rect x="650" y="-12" width="220" height="32" rx="2" fill="rgba(212,162,76,0.65)" transform="rotate(12 650 0)"/>
    <!-- Washi Tape Accent on Bottom-Left -->
    <rect x="-10" y="750" width="200" height="28" rx="2" fill="rgba(230,126,34,0.55)" transform="rotate(-8 0 750)"/>
  </g>
</svg>