<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <!-- Outer Dark/Wood Background -->
  <rect width="100%" height="100%" fill="#2a221a"/>

  <!-- Paper Card (Slightly Angled Look) -->
  <g transform="translate(54, 66)">
    <rect width="792" height="968" rx="8" fill="#f7f1e7" stroke="#d6ccb8" stroke-width="2"/>
    
    <!-- Grid pattern on paper -->
    <defs>
      <pattern id="grid_worst-8" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="792" height="968" rx="8" fill="url(#grid_worst-8)"/>

    <!-- Doodle Content -->
    
      <circle cx="450" cy="495" r="234" fill="#fce38a" stroke="#333" stroke-width="4"/>
      <circle cx="360" cy="440" r="12" fill="#333"/>
      <circle cx="540" cy="462" r="18" fill="#333"/>
      <path d="M 315 638 Q 450 792 585 572" fill="none" stroke="#e84a5f" stroke-width="6" stroke-linecap="round"/>
      <text x="450" y="935" font-family="cursive" font-size="28" fill="#ff5722" text-anchor="middle">Masterpiece in progress</text>
    

    <!-- Washi Tape Accent on Top-Right -->
    <rect x="585" y="-12" width="198" height="32" rx="2" fill="rgba(212,162,76,0.65)" transform="rotate(12 585 0)"/>
    <!-- Washi Tape Accent on Bottom-Left -->
    <rect x="-10" y="825" width="180" height="28" rx="2" fill="rgba(230,126,34,0.55)" transform="rotate(-8 0 825)"/>
  </g>
</svg>