<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <!-- Outer Dark/Wood Background -->
  <rect width="100%" height="100%" fill="#25211e"/>

  <!-- Paper Card (Slightly Angled Look) -->
  <g transform="translate(54, 66)">
    <rect width="792" height="968" rx="8" fill="#faf5eb" stroke="#d6ccb8" stroke-width="2"/>
    
    <!-- Grid pattern on paper -->
    <defs>
      <pattern id="grid_worst-1" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="792" height="968" rx="8" fill="url(#grid_worst-1)"/>

    <!-- Doodle Content -->
    
      <ellipse cx="450" cy="572" rx="252.00000000000003" ry="242" fill="#e6c280" stroke="#3d2a1d" stroke-width="5"/>
      <!-- Crooked ears -->
      <polygon points="288,374 234,198 396,352" fill="#d4a24c" stroke="#3d2a1d" stroke-width="4"/>
      <polygon points="522,352 666,242 612,385" fill="#d4a24c" stroke="#3d2a1d" stroke-width="4"/>
      <!-- Derpy Eyes -->
      <circle cx="378" cy="495" r="16" fill="#fff" stroke="#3d2a1d" stroke-width="3"/>
      <circle cx="405" cy="495" r="6" fill="#111"/>
      <circle cx="522" cy="517" r="22" fill="#fff" stroke="#3d2a1d" stroke-width="3"/>
      <circle cx="504.00000000000006" cy="539" r="7" fill="#111"/>
      <!-- Nose & Mouth -->
      <polygon points="441,605 468,605 454.5,638" fill="#f28e8e"/>
      <path d="M 396 682 Q 450 748 513 671" fill="none" stroke="#3d2a1d" stroke-width="3"/>
      <!-- Stick legs -->
      <line x1="315" y1="792" x2="315" y2="946" stroke="#3d2a1d" stroke-width="5" stroke-linecap="round"/>
      <line x1="405" y1="803" x2="387" y2="957" stroke="#3d2a1d" stroke-width="5" stroke-linecap="round"/>
      <line x1="522" y1="803" x2="540" y2="946" stroke="#3d2a1d" stroke-width="5" stroke-linecap="round"/>
      <line x1="594" y1="781" x2="630" y2="935" stroke="#3d2a1d" stroke-width="5" stroke-linecap="round"/>
    

    <!-- Washi Tape Accent on Top-Right -->
    <rect x="585" y="-12" width="198" height="32" rx="2" fill="rgba(212,162,76,0.65)" transform="rotate(12 585 0)"/>
    <!-- Washi Tape Accent on Bottom-Left -->
    <rect x="-10" y="825" width="180" height="28" rx="2" fill="rgba(230,126,34,0.55)" transform="rotate(-8 0 825)"/>
  </g>
</svg>